name: Gerar ícones oficiais da Nexa
on:
  push:
    branches:
      - feat/nexa-brand-notificacoes-20261118
permissions:
  contents: write
jobs:
  converter:
    if: "!contains(github.event.head_commit.message, 'chore(assets):')"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Converter APENAS a imagem fornecida pela proprietária
        run: |
          python -m pip install "Pillow==11.3.0"
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          origem = Image.open("public/nexa-app.webp").convert("RGB")
          destino = Path("public/pwa-icons")
          destino.mkdir(parents=True, exist_ok=True)
          for size in (180, 192, 512):
              img = origem.resize((size,size), Image.Resampling.LANCZOS)
              img.save(destino / ("icon-%s.png" % size),optimize=True,compress_level=9)
          PY
      - name: Publicar somente os PNGs gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pwa-icons/
          git diff --cached --quiet && exit 0
          git commit -m "chore(assets): gerar ícones oficiais PNG da Nexa"
          git push origin HEAD:feat/nexa-brand-notificacoes-20261118
