<!-- translucent flowing connector -->
<path d="M338 505 Q393 487 442 528 L824 808 Q880 850 923 835 Q963 818 969 757 L969 606 Q956 670 891 658 Q855 654 820 631 L449 537 Q399 496 338 505 Z" fill="url(#stripe)" opacity=".87" />
