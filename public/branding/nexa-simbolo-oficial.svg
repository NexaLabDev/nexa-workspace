 <clipPath id="leftclip"><path d="M274 306 Q274 220 348 250 L587 428 Q610 444 610 475 L610 736 Q610 770 579 791 L354 925 Q274 963 274 865 Z"/></clipPath>
 <clipPath id="rightclip"><path d="M633 455 Q633 424 660 400 L884 247 Q969 193 969 303 L969 861 Q969 963 893 928 L660 770 Q633 754 633 717 Z"/></clipPath>
