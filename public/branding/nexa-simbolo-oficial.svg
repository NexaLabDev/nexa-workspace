<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 175 850 830" width="850" height="830">
<defs>
 <linearGradient id="white" x1="300" y1="260" x2="620" y2="840" gradientUnits="userSpaceOnUse">
   <stop stop-color="#fff"/><stop offset=".48" stop-color="#EAEAEA"/><stop offset=".72" stop-color="#A1A1A1"/><stop offset="1" stop-color="#fff"/>
 </linearGradient>
 <linearGradient id="lowerwhite" x1="520" y1="510" x2="390" y2="910" gradientUnits="userSpaceOnUse">
   <stop stop-color="#565656"/><stop offset=".45" stop-color="#747474"/><stop offset="1" stop-color="#F8F8F8"/>
 </linearGradient>
 <linearGradient id="green" x1="820" y1="252" x2="815" y2="910" gradientUnits="userSpaceOnUse">
   <stop stop-color="#D6FF24"/><stop offset=".32" stop-color="#9DFA00"/><stop offset=".66" stop-color="#2E9D04"/><stop offset="1" stop-color="#B8FF08"/>
 </linearGradient>
 <linearGradient id="topgreen" x1="770" y1="332" x2="830" y2="650" gradientUnits="userSpaceOnUse">
  <stop stop-color="#75D500"/><stop offset=".58" stop-color="#176E06"/><stop offset="1" stop-color="#073E07"/>
 </linearGradient>
 <linearGradient id="stripe" x1="330" y1="500" x2="900" y2="820" gradientUnits="userSpaceOnUse">
  <stop stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".42" stop-color="#FCFFFC" stop-opacity=".30"/><stop offset=".72" stop-color="#DDFCE0" stop-opacity=".22"/><stop offset="1" stop-color="#D9FFB2" stop-opacity=".45"/>
