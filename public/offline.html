<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#141516"/>
  <title>Nexa Workspace — sem conexão</title>
  <style>
    * { box-sizing: border-box; }
    html,body { margin:0; min-height:100%; background:#141516; color:#f5f5f5; font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { min-height:100dvh; padding:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .marca { width:76px; height:76px; border-radius:22px; display:block; object-fit:cover; margin-bottom:22px; }
    h1 { font-size:24px; margin:0 0 10px; }
    p { color:#ccc; max-width:360px; margin:0 0 24px; }
    button { border:0; border-radius:14px; padding:14px 20px; background:#c4f03a; color:#141516; font:700 16px system-ui; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/nexa-app.webp" class="marca" alt="Ícone Nexa" />
    <h1>Sem conexão com a internet</h1>
    <p>O Nexa Workspace precisa de conexão para carregar seus dados de forma segura. Verifique a rede e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
